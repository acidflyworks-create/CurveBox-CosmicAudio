name: Windows x64 build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure VST3 and tests
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCURVEBOX_BUILD_FORMATS=VST3 -DCURVEBOX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --target CurveBox_VST3 CurveBoxDSPTests --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check preset parameter IDs
        run: python _tests/check_param_ids.py
      - name: Verify Windows x64 plugin
        shell: pwsh
        run: |
          $dll = 'build/CurveBox_artefacts/Release/VST3/CurveBox.vst3/Contents/x86_64-win/CurveBox.vst3'
          python _tests/check_windows_binary.py $dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $validator = Get-ChildItem pluginval -Filter pluginval.exe -Recurse | Select-Object -First 1
          if (!$validator) { throw 'pluginval.exe not found' }
          & $validator.FullName --strictness-level 5 --validate (Resolve-Path 'build/CurveBox_artefacts/Release/VST3/CurveBox.vst3').Path 2>&1 | Tee-Object -FilePath pluginval.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $tail = (Get-Content pluginval.log | Select-Object -Last 70) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::pluginval failed ($result):%0A$tail"
            exit 1
          }
      - name: REAPER x64 plugin insertion smoke test
        shell: pwsh
        run: ./_tests/reaper/smoke.ps1
      - name: Create installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" '/DPluginFormat=VST3' "/DPayloadDir=$((Resolve-Path 'build/CurveBox_artefacts/Release/VST3').Path)" installer/CurveBox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'packages/CurveBox-VST3-Windows-x64-Setup.exe')) { throw 'Installer not found' }
      - name: Test installer and uninstaller
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'CurveBox-install-test'
          $installer = Resolve-Path 'packages/CurveBox-VST3-Windows-x64-Setup.exe'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $installed = Join-Path $target 'CurveBox.vst3/Contents/x86_64-win/CurveBox.vst3'
          python _tests/check_windows_binary.py $installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Join-Path $env:ProgramData 'CurveBox/Uninstall/VST3/unins000.exe'
          $process = Start-Process $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $installed)) { throw 'Uninstaller failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: CurveBox-VST3-Windows-x64
          path: |
            build/CurveBox_artefacts/Release/VST3/CurveBox.vst3/**
            packages/CurveBox-VST3-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
